<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jaspion Player Futurista</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#000;color:#fff;overflow-x:hidden;
  background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBPjLVTM6mkdjoZlZppaxyXVEr-wDk4Ya1SD8C3LUmcA&s');
  background-size:cover;background-position:center;background-attachment:fixed
}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:-1}
.topo{text-align:center;padding:20px}
.topo img{width:120px;animation:flutuar 3s infinite ease-in-out;filter:drop-shadow(0 0 20px cyan)}
@keyframes flutuar{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
h1{margin-top:10px;font-size:28px;color:#00ffff;text-shadow:0 0 15px cyan}
.lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;padding:20px}
.card{
  background:rgba(0,0,0,.75);border:2px solid cyan;border-radius:20px;overflow:hidden;
  box-shadow:0 0 20px cyan;transition:.3s
}
.card:hover{transform:scale(1.03);box-shadow:0 0 30px #00ffff}
.card img{width:100%;height:200px;object-fit:cover}
.info{padding:15px}
.info h2{font-size:20px;margin-bottom:10px;color:#00ffff}
.info p{color:#ccc;margin-bottom:15px}
button{
  width:100%;padding:12px;border:none;border-radius:10px;background:cyan;color:#000;
  font-weight:bold;cursor:pointer;transition:.3s
}
button:hover{background:#00aaff;color:#fff}
.player-box{width:100%;padding:20px}
video{
  width:100%;border-radius:20px;border:2px solid cyan;box-shadow:0 0 25px cyan;background:#000
}
.loading{text-align:center;padding:30px;font-size:20px;color:cyan}
</style>
</head>
<body>
<div class="overlay"></div>

<div class="topo">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmhGObVmhlxH9192A1fjgDZQFuCbNOZZEB08FniFy0LQ&s=10" />
  <h1>JASPION PLAYER FUTURISTA</h1>
</div>

<div class="player-box">
  <video id="player" controls autoplay playsinline></video>
</div>

<div class="loading" id="loading">CARREGANDO LISTA DROPBOX...</div>
<div class="lista" id="lista"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const LINK_PLAYLIST = "https://dl.dropbox.com/scl/fi/w3uj6wnegls53e3hte2mp/Jaspion.txt?rlkey=n9n8liwcmbyqkmc4xamlha97y&st=rsfikahe&dl=1";

const lista = document.getElementById("lista");
const player = document.getElementById("player");
const loading = document.getElementById("loading");

fetch(LINK_PLAYLIST)
  .then(res => res.text())
  .then(data => {
    loading.style.display = "none";
    const linhas = data.split('
');

    let logo = "";
    let categoria = "";
    let nome = "";

    for (let i = 0; i < linhas.length; i++) {
      const linha = linhas[i].trim();

      if (linha.startsWith("#EXTINF")) {
        const logoMatch = linha.match(/tvg-logo="(.*?)"/);
        const grupoMatch = linha.match(/group-title="(.*?)"/);

        logo = logoMatch ? logoMatch[1] : "";
        categoria = grupoMatch ? grupoMatch[1] : "STREAM";
        nome = linha.split(',').pop();
      } else if (linha.startsWith("http")) {
        criarCard(nome, logo, categoria, linha);
      }
    }
  })
  .catch(() => {
    loading.textContent = "ERRO AO CARREGAR LISTA DROPBOX";
  });

function criarCard(nome, logo, categoria, url) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img src="${logo}" onerror="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBPjLVTM6mkdjoZlZppaxyXVEr-wDk4Ya1SD8C3LUmcA&s'">
    <div class="info">
      <h2>${nome || 'SEM NOME'}</h2>
      <p>${categoria || 'STREAM'}</p>
      <button onclick="tocar('${url.replace(/'/g, "\\'")}')">ASSISTIR</button>
    </div>
  `;

  lista.appendChild(card);
}

function tocar(url) {
  if (window.hlsInstance) {
    window.hlsInstance.destroy();
    window.hlsInstance = null;
  }

  if (url.includes(".m3u8")) {
    if (Hls.isSupported()) {
      window.hlsInstance = new Hls();
      window.hlsInstance.loadSource(url);
      window.hlsInstance.attachMedia(player);
      window.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => player.play());
    } else {
      player.src = url;
      player.play();
    }
  } else {
    player.src = url;
    player.play();
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}
</script>
</body>
</html>,
