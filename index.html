
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicativo TV Plus</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e0e0e;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 18px;
      background: linear-gradient(135deg, #111827, #075985);
      text-align: center;
      box-shadow: 0 2px 10px #000;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      color: #dbeafe;
    }

    .container {
      width: 95%;
      max-width: 1300px;
      margin: 20px auto;
    }

    #testeBox {
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: #172033;
      border: 1px solid #2563eb;
      text-align: center;
    }

    #contador {
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      margin: 0 8px;
    }

    a {
      color: #fff;
    }

    .botao {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .botao:hover {
      background: #1d4ed8;
    }

    .painel {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 20px;
    }

    .player-area,
    .lista-area {
      background: #171717;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 10px #000;
    }

    video {
      width: 100%;
      max-height: 570px;
      background: #000;
      border-radius: 8px;
    }

    #tituloAtual {
      margin: 12px 0 0;
      color: #93c5fd;
      font-size: 18px;
    }

    #busca {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #262626;
      color: #fff;
      outline: none;
    }

    #busca:focus {
      border-color: #38bdf8;
    }

    #status {
      color: #a3a3a3;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .categoria {
      margin-bottom: 18px;
    }

    .categoria h3 {
      margin: 0 0 8px;
      padding-bottom: 6px;
      color: #38bdf8;
      border-bottom: 1px solid #333;
      font-size: 16px;
    }

    .canal {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      text-align: left;
      border: 1px solid #333;
      border-radius: 5px;
      background: #242424;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }

    .canal:hover {
      background: #075985;
      border-color: #38bdf8;
    }

    .canal small {
      display: block;
      margin-top: 4px;
      color: #a3a3a3;
    }

    #bloqueio {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      padding: 80px 20px;
      background: rgba(0, 0, 0, 0.97);
      text-align: center;
    }

    #bloqueio h2 {
      color: #f87171;
      font-size: 28px;
    }

    #bloqueio p {
      color: #d4d4d4;
      font-size: 17px;
    }

    .erro {
      padding: 15px;
      color: #fecaca;
      background: #450a0a;
      border-radius: 6px;
    }

    @media (max-width: 800px) {
      .painel {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>📺 Aplicativo TV Plus</h1>
    <p> canais de televisão online</p>
  </header>

  <main class="container">
    <div id="testeBox">
      <strong>Período de teste:</strong>
      <span id="contador">20:00</span>

      <a
        class="botao"
        href="https://testeagora.tv/logtvseries"
        target="_blank"
        rel="noopener noreferrer"
      >
        Acessar teste
      </a>
    </div>

    <div class="painel">
      <section class="player-area">
        <video id="video" controls playsinline></video>
        <h2 id="tituloAtual">Selecione um canal</h2>
      </section>

      <aside class="lista-area">
        <input
          type="search"
          id="busca"
          placeholder="Pesquisar canal..."
          autocomplete="off"
        >

        <div id="status">Carregando canais...</div>
        <div id="lista"></div>
      </aside>
    </div>
  </main>

  <div id="bloqueio">
    <h2>Período de teste encerrado</h2>
    <p>Seu acesso de 20 minutos terminou.</p>

    <a
      class="botao"
      href="https://testeagora.tv/logtvseries"
      target="_blank"
      rel="noopener noreferrer"
    >
      Renovar ou acessar o teste
    </a>
  </div>

  <script>
    const URL_M3U =
      "https://iptv-org.github.io/iptv/countries/br.m3u";

    const DURACAO_TESTE = 20 * 60 * 1000;
    const CHAVE_INICIO_TESTE = "aplicativo_tv_plus_inicio_teste";

    const video = document.getElementById("video");
    const lista = document.getElementById("lista");
    const busca = document.getElementById("busca");
    const status = document.getElementById("status");
    const contador = document.getElementById("contador");
    const tituloAtual = document.getElementById("tituloAtual");

    let canais = [];
    let hls = null;
    let intervaloTeste = null;

    function iniciarTeste() {
      let inicio = localStorage.getItem(CHAVE_INICIO_TESTE);

      if (!inicio) {
        inicio = Date.now();
        localStorage.setItem(CHAVE_INICIO_TESTE, inicio);
      }

      atualizarContador();
      intervaloTeste = setInterval(atualizarContador, 1000);
    }

    function atualizarContador() {
      const inicio = Number(
        localStorage.getItem(CHAVE_INICIO_TESTE)
      );

      const restante = DURACAO_TESTE - (Date.now() - inicio);

      if (restante <= 0) {
        bloquearAcesso();
        return;
      }

      const totalSegundos = Math.floor(restante / 1000);
      const minutos = Math.floor(totalSegundos / 60);
      const segundos = totalSegundos % 60;

      contador.textContent =
        String(minutos).padStart(2, "0") + ":" +
        String(segundos).padStart(2, "0");
    }

    function bloquearAcesso() {
      clearInterval(intervaloTeste);

      document.getElementById("testeBox").style.display = "none";
      document.getElementById("bloqueio").style.display = "block";

      busca.disabled = true;
      lista.innerHTML = "";

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();
      tituloAtual.textContent = "Acesso bloqueado";
    }

    function analisarLinhaInfo(linha) {
      const dados = {};

      const regex = /([a-zA-Z0-9_-]+)="([^"]*)"/g;
      let resultado;

      while ((resultado = regex.exec(linha)) !== null) {
        dados[resultado[1]] = resultado[2];
      }

      return dados;
    }

    function analisarM3U(texto) {
      const linhas = texto
        .split(/\r?\n/)
        .map(linha => linha.trim())
        .filter(Boolean);

      const resultado = [];

      for (let i = 0; i < linhas.length; i++) {
        if (!linhas[i].startsWith("#EXTINF")) {
          continue;
        }

        const linhaInfo = linhas[i];
        const dados = analisarLinhaInfo(linhaInfo);
        const url = linhas[i + 1];

        if (!url || url.startsWith("#")) {
          continue;
        }

        const partes = linhaInfo.split(",");
        const nome = partes.length > 1
          ? partes.slice(1).join(",").trim()
          : "Canal sem nome";

        resultado.push({
          nome: nome || "Canal sem nome",
          grupo: dados["group-title"] || "Outros",
          logo: dados["tvg-logo"] || "",
          url: url
        });

        i++;
      }

      return resultado;
    }

    function escaparHTML(texto) {
      return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function mostrarCanais(filtro = "") {
      lista.innerHTML = "";

      const termo = filtro.toLowerCase().trim();

      const filtrados = canais.filter(canal =>
        canal.nome.toLowerCase().includes(termo) ||
        canal.grupo.toLowerCase().includes(termo)
      );

      if (!filtrados.length) {
        lista.innerHTML = "<p>Nenhum canal encontrado.</p>";
        return;
      }

      const grupos = {};

      filtrados.forEach(canal => {
        if (!grupos[canal.grupo]) {
          grupos[canal.grupo] = [];
        }

        grupos[canal.grupo].push(canal);
      });

      Object.keys(grupos)
        .sort()
        .forEach(grupo => {
          const categoria = document.createElement("div");
          categoria.className = "categoria";

          const titulo = document.createElement("h3");
          titulo.textContent =
            grupo + " (" + grupos[grupo].length + ")";

          categoria.appendChild(titulo);

          grupos[grupo].forEach(canal => {
            const botao = document.createElement("button");
            botao.className = "canal";
            botao.type = "button";

            botao.innerHTML =
              escaparHTML(canal.nome) +
              "<small>" +
              escaparHTML(canal.grupo) +
              "</small>";

            botao.addEventListener("click", () => reproduzir(canal));
            categoria.appendChild(botao);
          });

          lista.appendChild(categoria);
        });
    }

    function reproduzir(canal) {
      tituloAtual.textContent = canal.nome;

      if (hls) {
        hls.destroy();
        hls = null;
      }

      video.pause();
      video.removeAttribute("src");
      video.load();

      if (
        canal.url.includes(".m3u8") &&
        Hls.isSupported()
      ) {
        hls = new Hls();

        hls.loadSource(canal.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, function(evento, dados) {
          if (dados.fatal) {
            tituloAtual.textContent =
              "Erro ao carregar este canal.";
          }
        });
      } else {
        video.src = canal.url;

        video.play().catch(() => {});
      }
    }

    async function carregarLista() {
      try {
        status.textContent = "Baixando lista de canais...";

        const resposta = await fetch(URL_M3U);

        if (!resposta.ok) {
          throw new Error("Não foi possível baixar a lista.");
        }

        const texto = await resposta.text();
        canais = analisarM3U(texto);

        status.textContent =
          canais.length + " canais carregados.";

        mostrarCanais();
      } catch (erro) {
        console.error(erro);

        status.innerHTML =
          '<div class="erro">' +
          "Não foi possível carregar a lista M3U. " +
          "Verifique a conexão ou as permissões de CORS." +
          "</div>";
      }
    }

    busca.addEventListener("input", () => {
      mostrarCanais(busca.value);
    });

    iniciarTeste();
    carregarLista();
  </script>
</body>
</html>
````
